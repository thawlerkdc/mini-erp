databases:
  - name: mini-erp-homolog-db
    plan: free

services:
  - type: web
    name: mini-erp-homolog
    plan: free
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app -c gunicorn_config.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mini-erp-homolog-db
          property: connectionString
      - key: APP_ENV
        value: homolog
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: onboarding@resend.dev
      - key: EMAIL_DELIVERY_MODE
        value: resend_only
      - key: WEB_CONCURRENCY
        value: 1
